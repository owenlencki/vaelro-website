<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This page's title, description, canonical, robots, Open Graph,
         Twitter card, and JSON-LD, written in by scripts/prerender.mjs from
         the page's <Seo> (src/seo/Seo.tsx) -->
    <!--app-head-->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Analytics (GA4) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-P80CTL6MX2"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-P80CTL6MX2");
    </script>

    <!-- Self-hosted fonts: preload heading + body -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sora-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- First-visit preloader on Home, switched on before first paint. The
         logic and the storage key live in src/components/layout/Preloader.tsx;
         this only sets the attribute early, plus a failsafe so a failed app
         bundle can never leave the page covered. -->
    <script>
      (function () {
        try {
          var trim = /\/+$/;
          var home =
            location.pathname.replace(trim, "") ===
            "%BASE_URL%".replace(trim, "");
          if (
            !home ||
            sessionStorage.getItem("vaelro-preloader-shown") ||
            matchMedia("(prefers-reduced-motion: reduce)").matches
          ) {
            return;
          }
          var root = document.documentElement;
          root.setAttribute("data-preloader", "");
          window.__vaelroPreloader = setTimeout(function () {
            root.removeAttribute("data-preloader");
            sessionStorage.setItem("vaelro-preloader-shown", "1");
          }, 8000);
        } catch (e) {}
      })();
    </script>

    <!-- A few reveals (the footer's) are prerendered in their faded-out
         starting state. Without JavaScript nothing plays them, so show them
         in their final state. Decorative (aria-hidden) elements keep theirs:
         some rest invisible on purpose. -->
    <noscript>
      <style>
        :is([style*="opacity:0;"], [style$="opacity:0"]):not(
            [aria-hidden="true"],
            [aria-hidden="true"] *
          ) {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
