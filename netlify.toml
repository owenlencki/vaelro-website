[build]
  command = "npm run build"
  publish = "dist"

# vaelro.co/upload is the short link on the Session 2 slide. It sends people to
# the packet upload form, which is its own Netlify site (the same address as
# PACKET_UPLOAD_URL in src/data/workshop.ts, so change the two together).
# Netlify takes the first rule that matches, reading dist/_redirects and then
# this file from the top, so this must stay above the catch-all below. It is
# forced so that no file in dist/ can ever shadow it. No page links to /upload:
# the prerender would crawl it as a page and fail the build.
[[redirects]]
  from = "/upload"
  to = "https://vaelro-packet-upload.netlify.app"
  status = 302
  force = true

# Every page is prerendered to its own HTML file (scripts/prerender.mjs), and
# the build also writes dist/_redirects, which serves each one at its
# slash-free URL. Netlify reads _redirects before these rules, and files that
# exist are served before this catch-all, so it only answers for paths with no
# page: the prerendered 404 page, with a real 404 status. (The old SPA rule
# answered 200 with the home page, which search engines count as a soft 404.)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# The Session 1 attendee page is for the people who were in the room. The card
# on /workshop links to it, but it stays out of search results and the
# sitemap: its prerendered HTML carries a noindex meta tag, and this header
# says the same at the edge for any crawler that only reads headers. Netlify
# matches headers against the requested path.
[[headers]]
  for = "/workshop/session-1"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
