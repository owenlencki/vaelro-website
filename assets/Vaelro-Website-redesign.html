D-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7a6f640a-dd41-4052-97ef-0931b9bd1cbb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- Color: Surfaces (the dark stack) ---------- */\n  --vaelro-base:       #080706;  /* Night — page background floor */\n  --vaelro-deep:       #120c09;  /* Deep Ember — sections / large surfaces */\n  --vaelro-panel:      #1a130e;  /* Panel Smoke — raised panels / cards */\n  --vaelro-panel-2:    #221912;  /* Panel Smoke 2 — pop-out cards / sheets */\n  --vaelro-line:       rgba(255, 255, 255, 0.08);\n  --vaelro-line-soft:  rgba(255, 255, 255, 0.04);\n  --vaelro-line-strong:rgba(255, 255, 255, 0.14);\n\n  /* ---------- Color: Foreground (warm off-white) ---------- */\n  --vaelro-text:       #f8efe7;                       /* primary text / canvas */\n  --vaelro-muted:      rgba(248, 239, 231, 0.70);     /* secondary copy */\n  --vaelro-soft:       rgba(248, 239, 231, 0.46);     /* tertiary / labels */\n  --vaelro-faint:      rgba(248, 239, 231, 0.24);     /* placeholders */\n\n  /* ---------- Color: Signal (the orange family) ---------- */\n  --vaelro-orange:        #ff7a18;  /* Signal — primary action */\n  --vaelro-orange-deep:   #ff5200;  /* Burnt — pressed / deep accent */\n  --vaelro-orange-bright: #ffa048;  /* Glow — highlights / hovers */\n  --vaelro-orange-soft:   #ffc58f;  /* Amber — pale accents, type highlights */\n  --vaelro-orange-tint:   rgba(255, 122, 24, 0.14); /* fills behind text */\n  --vaelro-orange-glow:   rgba(255, 122, 24, 0.22); /* soft halo */\n\n  /* ---------- Color: Semantic ---------- */\n  --vaelro-success:    #5ad19a;\n  --vaelro-warn:       #ffc15a;\n  --vaelro-danger:     #ff6b6b;\n  --vaelro-info:       #7bb6ff;\n\n  /* ---------- Gradients ---------- */\n  --vaelro-gradient: linear-gradient(135deg, #ffc58f 0%, #ff7a18 56%, #ff5200 100%);\n  --vaelro-gradient-soft: linear-gradient(180deg, rgba(255,122,24,0.18), rgba(255,82,0,0));\n  --vaelro-gradient-text: linear-gradient(135deg, #ffd9b0 0%, #ff7a18 60%, #ff5200 100%);\n  --vaelro-bg-stage:\n    radial-gradient(circle at 18% 12%, rgba(255, 122, 24, 0.18), transparent 22%),\n    radial-gradient(circle at 84% 16%, rgba(255, 197, 143, 0.08), transparent 20%),\n    linear-gradient(180deg, var(--vaelro-base) 0%, var(--vaelro-deep) 100%);\n\n  /* ---------- Type families ---------- */\n  --vaelro-serif:  \"Fraunces\", \"Source Serif Pro\", Georgia, serif;\n  --vaelro-sans:   \"Sora\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --vaelro-mono:   \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* ---------- Type weights ---------- */\n  --w-light: 300;\n  --w-regular: 400;\n  --w-medium: 500;\n  --w-semibold: 600;\n  --w-bold: 700;\n\n  /* ---------- Type scale (semantic) ---------- */\n  --display-1: 5.5rem;   /* 88px — hero */\n  --display-2: 4rem;     /* 64px */\n  --h1: 3rem;            /* 48px */\n  --h2: 2.25rem;         /* 36px */\n  --h3: 1.625rem;        /* 26px */\n  --h4: 1.25rem;         /* 20px */\n  --body-lg: 1.125rem;   /* 18px */\n  --body:    1rem;       /* 16px */\n  --body-sm: 0.9375rem;  /* 15px */\n  --caption: 0.8125rem;  /* 13px */\n  --eyebrow: 0.75rem;    /* 12px uppercase mono */\n\n  /* ---------- Spacing (8pt-ish, with a 4 base) ---------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 20px;\n  --s-6: 24px;\n  --s-8: 32px;\n  --s-10: 40px;\n  --s-12: 48px;\n  --s-16: 64px;\n  --s-20: 80px;\n  --s-24: 96px;\n\n  /* ---------- Radii (generous, cinematic) ---------- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 14px;\n  --radius-lg: 18px;\n  --radius-xl: 24px;\n  --radius-2xl: 34px;\n  --radius-pill: 999px;\n\n  /* ---------- Shadows + Glows ---------- */\n  --shadow-1:    0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.4);\n  --shadow-2:    0 6px 18px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.04) inset;\n  --shadow-3:    0 14px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;\n  --shadow-4:    0 30px 80px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.05) inset;\n  --glow-orange: 0 0 0 1px rgba(255,122,24,0.25), 0 12px 32px rgba(255,82,0,0.32);\n  --glow-orange-sm: 0 0 0 1px rgba(255,122,24,0.20), 0 6px 18px rgba(255,82,0,0.22);\n\n  /* ---------- Motion ---------- */\n  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-snap:  cubic-bezier(0.5, 1.5, 0.5, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n\n  /* ---------- Layout ---------- */\n  --container: 1200px;\n  --container-wide: 1440px;\n  --grid-line: rgba(255,255,255,0.03);\n}\n\n/* =========================================================================\n   Semantic element styles. Apply by adding utility classes\n   (`.v-display`, `.v-h1`, `.v-eyebrow`, etc.) or wire them up however you\n   like in a UI kit. Kept as plain selectors so they tree-shake cleanly.\n   ========================================================================= */\n\n.v-display, .v-h1, .v-h2, .v-h3, .v-h4 {\n  font-family: var(--vaelro-serif);\n  font-weight: var(--w-medium);\n  color: var(--vaelro-text);\n  letter-spacing: -0.03em;\n  line-height: 1.02;\n  margin: 0;\n  text-wrap: balance;\n}\n\n.v-display { font-size: var(--display-1); letter-spacing: -0.04em; line-height: 0.96; }\n.v-h1      { font-size: var(--h1); }\n.v-h2      { font-size: var(--h2); line-height: 1.06; }\n.v-h3      { font-size: var(--h3); line-height: 1.15; letter-spacing: -0.02em; }\n.v-h4      { font-size: va   <h4 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:21px; line-height:1.12; letter-spacing:-0.015em; color:var(--vaelro-text); margin:0;\">Websites built for conversion<\u002Fh4>\n              <p style=\"font-family:var(--vaelro-sans); font-size:14.5px; line-height:1.55; color:var(--vaelro-muted); margin:12px 0 0;\">Not just looks — designed to get you leads.<\u002Fp>\n              <span style=\"flex:1;\"><\u002Fspan>\n              <span style=\"width:18px; height:18px; border-radius:999px; background:var(--vaelro-gradient); box-shadow:0 0 14px rgba(255,82,0,0.4); margin-top:24px;\"><\u002Fspan>\n            <\u002Farticle>\n            <article data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .18s, transform .8s var(--ease-out) .18s; background:var(--vaelro-panel); border:1px solid var(--vaelro-line); border-radius:20px; padding:28px; min-height:210px; display:flex; flex-direction:column;\" style-hover=\"transform:translateY(-4px); border-color:rgba(255,122,24,0.35);\">\n              <h4 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:21px; line-height:1.12; letter-spacing:-0.015em; color:var(--vaelro-text); margin:0;\">Local focus<\u002Fh4>\n              <p style=\"font-family:var(--vaelro-sans); font-size:14.5px; line-height:1.55; color:var(--vaelro-muted); margin:12px 0 0;\">We work exclusively with small businesses like yours. Based in Waupaca, we understand small-city business.<\u002Fp>\n              <span style=\"flex:1;\"><\u002Fspan>\n              <span style=\"width:18px; height:18px; border-radius:999px; background:var(--vaelro-gradient); box-shadow:0 0 14px rgba(255,82,0,0.4); margin-top:24px;\"><\u002Fspan>\n            <\u002Farticle>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:linear-gradient(180deg, var(--vaelro-deep), var(--vaelro-base)); padding:90px 24px 100px;\">\n        <div style=\"max-width:1200px; margin:0 auto;\">\n          <p data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); font-family:var(--vaelro-mono); font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--vaelro-orange-soft); margin:0 0 28px;\">Inside Vaelro<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;\">\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n              <image-slot id=\"home-meeting\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop your meeting photo\" style=\"width:100%; height:300px; display:block; border:1px solid var(--vaelro-line);\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .1s, transform .8s var(--ease-out) .1s;\">\n              <image-slot id=\"home-flow\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop your automation flow\" style=\"width:100%; height:300px; display:block; border:1px solid var(--vaelro-line);\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .2s, transform .8s var(--ease-out) .2s;\">\n              <image-slot id=\"home-team\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop the team photo\" style=\"width:100%; height:300px; display:block; border:1px solid var(--vaelro-line);\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= ABOUT ================= -->\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <section style=\"padding:110px 24px 70px; text-align:center; position:relative; overflow:hidden;\">\n        <div style=\"position:absolute; left:50%; top:-10%; transform:translateX(-50%); width:800px; height:600px; max-width:120vw; background:radial-gradient(circle at 50% 30%, rgba(255,122,24,0.12), transparent 60%); pointer-events:none;\"><\u002Fdiv>\n        <div style=\"position:relative; max-width:760px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:22px;\">\n          <h1 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(46px, 7vw, 88px); line-height:0.98; letter-spacing:-0.045em; color:var(--vaelro-text); margin:0;\">About Us<\u002Fh1>\n          <p style=\"font-family:var(--vaelro-serif); font-style:italic; font-weight:400; font-size:clamp(19px, 2.4vw, 24px); line-height:1.4; color:var(--vaelro-muted); margin:0; text-wrap:balance;\">Mission: To allow business owners to save time for things that are more important.<\u002Fp>\n          <span style=\"width:90px; height:1px; background:var(--vaelro-line-strong);\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:50px 24px; max-width:1200px; margin:0 auto;\">\n        <div style=\"display:grid; grid-template-columns:1fr 0.85fr; gap:56px; align-items:start;\">\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n            <h2 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(30px, 3.6vw, 42px); letter-spacing:-0.03em; color:var(--vaelro-text); margin:0 0 22px;\">Liam Bloedow<\u002Fh2>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0 0 16px;\">I graduated from Waupaca High School and currently attend UW Madison. I have developed my work ethic through being a three-sports athlete growing up, and still being able to become the salutatorian of my class.<\u002Fp>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0 0 16px;\">Growing up watching my dad run his own business gave me an early look at what it takes to run a business, as well as the ambition to start one of my own. For Vaelro, I bring a passion to deliver the best work possible, while making it custom to each client.<\u002Fp>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0;\">Through the sports I've played growing up, I understand the work it takes to perfect a skill, and with Vaelro, I can guarantee clients that I will use these skills to save business owners time and money.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .1s, transform .8s var(--ease-out) .1s;\">\n            <image-slot id=\"about-liam\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop Liam's photo\" style=\"width:100%; height:440px; display:block; border:1px solid var(--vaelro-line);\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:50px 24px 70px; max-width:1200px; margin:0 auto;\">\n        <div style=\"display:grid; grid-template-columns:0.85fr 1fr; gap:56px; align-items:start;\">\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .1s, transform .8s var(--ease-out) .1s;\">\n            <image-slot id=\"about-owen\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop Owen's photo\" style=\"width:100%; height:520px; display:block; border:1px solid var(--vaelro-line);\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n            <h2 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(30px, 3.6vw, 42px); letter-spacing:-0.03em; color:var(--vaelro-text); margin:0 0 22px;\">Owen Lencki<\u002Fh2>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0 0 16px;\">I grew up in Waupaca, Wisconsin, where entrepreneurship surrounded me. My grandpa first, then my Dad with Adventure Outfitters, and lastly my brother with Noah Lencki Design. Growing up watching them, I didn't just inherit their last name. I inherited the belief that you could build anything that you want, and chase your dreams.<\u002Fp>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0 0 16px;\">It started early. At six years old I was selling rainbow loom bracelets out of my dad's shop, making enough to reinvest and buy ice cream. That's where the journey started.<\u002Fp>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0 0 16px;\">Through high school I gave everything to running. That obsession paid off, I became a three-time state medalist, placed as high as 2nd in the state, and left Waupaca holding every distance school record. I was recruited to run collegiately at UW Stevens-Point. My freshman year, a stress reaction in my shin and then my femur took me out of my entire first season. It was one of the hardest stretches of my life, not just because of the pain, but because running had been my identity.<\u002Fp>\n            <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0;\">That entire year taught me more than any race I've run. It drove me deeper into my faith, which became the anchor I needed. It pushed me to build my marketing agency OLM, take on leadership roles at UWSP, be there for my friends, and eventually the vision behind Vaelro.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:linear-gradient(180deg, var(--vaelro-deep), var(--vaelro-base)); padding:90px 24px; border-top:1px solid var(--vaelro-line);\">\n        <div style=\"max-width:760px; margin:0 auto; text-align:center;\">\n          <h2 data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(30px, 4vw, 46px); letter-spacing:-0.03em; color:var(--vaelro-text); margin:0 0 48px;\">From the both of us<\u002Fh2>\n          <div style=\"display:flex; flex-direction:column; gap:44px;\">\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n              <div style=\"display:inline-flex; align-items:center; gap:12px; margin-bottom:14px;\"><span style=\"width:22px; height:22px; border-radius:999px; background:var(--vaelro-gradient); box-shadow:0 0 16px rgba(255,82,0,0.4); flex:none;\"><\u002Fspan><h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:21px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0;\">Why did we start Vaelro?<\u002Fh3><\u002Fdiv>\n              <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0; max-width:620px; margin-left:auto; margin-right:auto;\">AI is changing business, and business owners know. The problem isn't awareness, it's time. They're running their business, managing their team, and handling everything else. They don't have the time to figure out what works, or how to set it up. We do. We're able to diagnose the pain point, and provide a solution that fixes it.<\u002Fp>\n            <\u002Fdiv>\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n              <div style=\"display:inline-flex; align-items:center; gap:12px; margin-bottom:14px;\"><span style=\"width:22px; height:22px; border-radius:999px; background:var(--vaelro-gradient); box-shadow:0 0 16px rgba(255,82,0,0.4); flex:none;\"><\u002Fspan><h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:21px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0;\">What makes you different from a bigger agency?<\u002Fh3><\u002Fdiv>\n              <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0; max-width:620px; margin-left:auto; margin-right:auto;\">We've grown up around entrepreneurs, we understand the value of the time that they spent with us as kids and how that helped our develpment. We want to be able to provide value to business owners so that they can save time and get back to what's most important.<\u002Fp>\n            <\u002Fdiv>\n            <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out);\">\n              <div style=\"display:inline-flex; align-items:center; gap:12px; margin-bottom:14px;\"><span style=\"width:22px; height:22px; border-radius:999px; background:var(--vaelro-gradient); box-shadow:0 0 16px rgba(255,82,0,0.4); flex:none;\"><\u002Fspan><h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:21px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0;\">What do you want a client to feel after working with you?<\u002Fh3><\u002Fdiv>\n              <p style=\"font-family:var(--vaelro-sans); font-size:15.5px; line-height:1.72; color:var(--vaelro-muted); margin:0; max-width:620px; margin-left:auto; margin-right:auto;\">Like they got their time back. Not just that something just got built, but that their day got lighter, their operation got cleaner, and they can actually focus on the work they started their business to do.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:90px 24px 100px; max-width:1200px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(28px, 3.6vw, 42px); letter-spacing:-0.03em; color:var(--vaelro-text); margin:0 0 44px; text-align:center;\">Our Values<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:40px;\">\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); border-top:1px solid var(--vaelro-line-strong); padding-top:24px;\">\n            <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:24px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0 0 14px;\">Operational Efficiency<\u002Fh3>\n            <p style=\"font-family:var(--vaelro-sans); font-size:14.5px; line-height:1.65; color:var(--vaelro-muted); margin:0;\">We streamline your daily operations using AI-driven automation, freeing you to focus on what truly matters.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .1s, transform .8s var(--ease-out) .1s; border-top:1px solid var(--vaelro-line-strong); padding-top:24px;\">\n            <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:24px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0 0 14px;\">Local Impact<\u002Fh3>\n            <p style=\"font-family:var(--vaelro-sans); font-size:14.5px; line-height:1.65; color:var(--vaelro-muted); margin:0;\">Our solutions are built for the unique needs of small businesses, ensuring your digital presence resonates with your community.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .2s, transform .8s var(--ease-out) .2s; border-top:1px solid var(--vaelro-line-strong); padding-top:24px;\">\n            <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:24px; letter-spacing:-0.02em; color:var(--vaelro-text); margin:0 0 14px;\">Continuous Innovation<\u002Fh3>\n            <p style=\"font-family:var(--vaelro-sans); font-size:14.5px; line-height:1.65; color:var(--vaelro-muted); margin:0;\">We stay ahead of the curve by integrating the latest AI technologies into your workflow, keeping you competitive.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= WORK ================= -->\n    <sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <section style=\"padding:110px 24px 60px; text-align:center; position:relative; overflow:hidden;\">\n        <div style=\"position:absolute; left:50%; top:-10%; transform:translateX(-50%); width:800px; height:600px; max-width:120vw; background:radial-gradient(circle at 50% 30%, rgba(255,122,24,0.12), transparent 60%); pointer-events:none;\"><\u002Fdiv>\n        <div style=\"position:relative; max-width:740px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:20px;\">\n          <p style=\"font-family:var(--vaelro-mono); font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--vaelro-orange-soft); margin:0;\">Proof<\u002Fp>\n          <h1 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:clamp(42px, 6.4vw, 80px); line-height:0.98; letter-spacing:-0.045em; color:var(--vaelro-text); margin:0;\">Work that speaks for itself<\u002Fh1>\n          <p style=\"font-family:var(--vaelro-sans); font-size:clamp(16px, 2vw, 19px); color:var(--vaelro-muted); margin:0; max-width:520px; line-height:1.6;\">A look at what we build for local businesses — and the time it gives them back.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:50px 24px; max-width:1200px; margin:0 auto;\">\n        <p data-reveal=\"\" style=\"transition:opacity .7s var(--ease-out), transform .7s var(--ease-out); font-family:var(--vaelro-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vaelro-soft); margin:0 0 24px;\">Case studies · drop in your real projects<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;\">\n          <article data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); background:var(--vaelro-panel); border:1px solid var(--vaelro-line); border-radius:22px; overflow:hidden;\" style-hover=\"transform:translateY(-5px); border-color:var(--vaelro-line-strong);\">\n            <image-slot id=\"work-1\" shape=\"rect\" placeholder=\"Drop project image\" style=\"width:100%; height:220px; display:block;\"><\u002Fimage-slot>\n            <div style=\"padding:24px;\">\n              <span style=\"font-family:var(--vaelro-mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vaelro-orange-soft);\">Custom Website<\u002Fspan>\n              <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:22px; line-height:1.12; letter-spacing:-0.02em; color:var(--vaelro-text); margin:12px 0 10px;\">Built to convert, not just look good<\u002Fh3>\n              <p style=\"font-family:var(--vaelro-sans); font-size:14px; line-height:1.6; color:var(--vaelro-muted); margin:0;\">A fast, custom site designed around how your customers actually book.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .1s, transform .8s var(--ease-out) .1s; background:var(--vaelro-panel); border:1px solid var(--vaelro-line); border-radius:22px; overflow:hidden;\" style-hover=\"transform:translateY(-5px); border-color:var(--vaelro-line-strong);\">\n            <image-slot id=\"work-2\" shape=\"rect\" placeholder=\"Drop project image\" style=\"width:100%; height:220px; display:block;\"><\u002Fimage-slot>\n            <div style=\"padding:24px;\">\n              <span style=\"font-family:var(--vaelro-mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vaelro-orange-soft);\">Workflow Automation<\u002Fspan>\n              <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:22px; line-height:1.12; letter-spacing:-0.02em; color:var(--vaelro-text); margin:12px 0 10px;\">Hours back, every week<\u002Fh3>\n              <p style=\"font-family:var(--vaelro-sans); font-size:14px; line-height:1.6; color:var(--vaelro-muted); margin:0;\">Follow-ups, scheduling, and data entry handled automatically — so the day runs itself.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out) .2s, transform .8s var(--ease-out) .2s; background:var(--vaelro-panel); border:1px solid var(--vaelro-line); border-radius:22px; overflow:hidden;\" style-hover=\"transform:translateY(-5px); border-color:var(--vaelro-line-strong);\">\n            <image-slot id=\"work-3\" shape=\"rect\" placeholder=\"Drop project image\" style=\"width:100%; height:220px; display:block;\"><\u002Fimage-slot>\n            <div style=\"padding:24px;\">\n              <span style=\"font-family:var(--vaelro-mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vaelro-orange-soft);\">AI Strategy<\u002Fspan>\n              <h3 style=\"font-family:var(--vaelro-serif); font-weight:500; font-size:22px; line-height:1.12; letter-spacing:-0.02em; color:var(--vaelro-text); margin:12px 0 10px;\">A clear plan to act on<\u002Fh3>\n              <p style=\"font-family:var(--vaelro-sans); font-size:14px; line-height:1.6; color:var(--vaelro-muted); margin:0;\">We map exactly where AI saves you time and money, then build the system that does it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:linear-gradient(180deg, var(--vaelro-deep), var(--vaelro-base)); border-top:1px solid var(--vaelro-line); padding:90px 24px 100px;\">\n        <div style=\"max-width:1200px; margin:0 auto;\">\n          <div data-reveal=\"\" style=\"transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); text-align:center; margin-bottom:44px;\">\n            <p style=\"font-family:var(--vaelro-mono); font gba(255,82,0,0.45); animation:vPulse 2.8s var(--ease-out) infinite; transition:transform .15s var(--ease-out), filter .2s var(--ease-out);\" style-hover=\"transform:translateY(-2px); filter:brightness(1.06);\">Book a free call <span style=\"font-size:16px;\">→<\u002Fspan><\u002Fbutton>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', assembled: false, shimmer: false, settled: false, formSent: false };\n\n  perimeter(t) {\n    const s = t * 4;\n    if (s < 1) return { x: s * 100, y: 0 };\n    if (s < 2) return { x: 100, y: (s - 1) * 100 };\n    if (s < 3) return { x: (3 - s) * 100, y: 100 };\n    return { x: 0, y: (4 - s) * 100 };\n  }\n\n  buildShards() {\n    const cols = 4, rows = 4;\n    const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };\n    // Jittered vertex mesh — interior vertices are nudged so the logo breaks\n    // into chunky, irregular shards that tile perfectly (no gaps).\n    const V = [];\n    for (let r = 0; r <= rows; r++) {\n      V[r] = [];\n      for (let c = 0; c <= cols; c++) {\n        let x = (c / cols) * 100, y = (r / rows) * 100;\n        if (c > 0 && c < cols) x += (rnd(r * 9 + c) * 2 - 1) * 7;\n        if (r > 0 && r < rows) y += (rnd(c * 9 + r + 50) * 2 - 1) * 7;\n        V[r][c] = { x, y };\n      }\n    }\n    const shards = [];\n    let i = 0;\n    for (let r = 0; r < rows; r++) {\n      for (let c = 0; c < cols; c++) {\n        const a = V[r][c], b = V[r][c + 1], d = V[r + 1][c + 1], e = V[r + 1][c];\n        const poly = `polygon(${a.x}% ${a.y}%, ${b.x}% ${b.y}%, ${d.x}% ${d.y}%, ${e.x}% ${e.y}%)`;\n        const ccx = (a.x + b.x + d.x + e.x) / 4, ccy = (a.y + b.y + d.y + e.y) / 4;\n        // Fling each shard out toward the page edges, in the direction it sits\n        // from the logo's centre, spread wider horizontally than vertically.\n        const ang = Math.atan2(ccy - 50, ccx - 50) + (rnd(i + 5) * 0.8 - 0.4);\n        const rad = 0.34 + rnd(i + 3) * 0.18;\n        let sx = 0.5 + Math.cos(ang) * rad * 1.5;\n        let sy = 0.5 + Math.sin(ang) * rad * 1.08;\n        sx = Math.min(0.94, Math.max(0.06, sx));\n        sy = Math.min(0.93, Math.max(0.06, sy));\n        shards.push({\n          poly, sx, sy,\n          rot: ((i % 2) ? 1 : -1) * (7 + (i * 17) % 16),\n          delay: Math.round(rnd(i + 11) * 300),\n        });\n        i++;\n      }\n    }\n    return shards;\n  }\n\n  measureBox() {\n    const el = document.getElementById('vHeroBox');\n    if (!el) return;\n    const r = el.getBoundingClientRect();\n    if (!r.width) return;\n    this.box = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, size: r.width };\n    this.forceUpdate();\n  }\n\n  componentDidMount() {\n    this._lastPage = 'home';\n    this.shards = this.buildShards();\n    this.forceUpdate();\n    this.startHero();\n    this.setupScroll();\n    window.addEventListener('resize', () => { if (!this.state.settled) this.measureBox(); });\n  }\n\n  componentDidUpdate() {\n    if (this._lastPage !== this.state.page) {\n      this._lastPage = this.state.page;\n      window.scrollTo({ top: 0 });\n      if (this.state.page === 'home') this.restartHero();\n      requestAnimationFrame(() => this.replayReveals());\n    }\n  }\n\n  restartHero() {\n    this.setState({ assembled: false, shimmer: false, settled: false });\n    this.startHero();\n  }\n\n  startHero() {\n    clearTimeout(this._a); clearTimeout(this._s); clearTimeout(this._set); clearInterval(this._mi);\n    // Re-measure where the in-flow logo box sits so the scattered fragments\n    // (in a fixed full-viewport layer) know where to magnet back to. The home\n    // section streams in, so poll until the box is actually laid out.\n    this.box = null;\n    const tryMeasure = () => { this.measureBox(); if (this.box) clearInterval(this._mi) tWidth;\n      el.style.animation = '';\n    });\n  }\n\n  makeStreak(key, animate) {\n    const LOGO_URL = (typeof window !== 'undefined' && window.__resources && window.__resources.logoMark) || 'assets/vaelro-logo-mark.png';\n    return React.createElement('div', { key, style: {\n      position: 'absolute', inset: 0, zIndex: 3, pointerEvents: 'none', overflow: 'hidden',\n      WebkitMaskImage: \"url('\" + LOGO_URL + \"')\", maskImage: \"url('\" + LOGO_URL + \"')\",\n      WebkitMaskSize: 'contain', maskSize: 'contain',\n      WebkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat',\n      WebkitMaskPosition: 'center', maskPosition: 'center',\n    }}, React.createElement('div', { style: {\n      position: 'absolute', top: '-50%', left: 0, width: '40%', height: '200%',\n      background: 'linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.9) 50%, transparent 70%)',\n      filter: 'blur(2px)', transform: 'translateX(-200%)',\n      animation: animate ? 'vShimmer 5.5s ease-in-out 0.1s infinite' : 'none',\n    }}));\n  }\n\n  renderShatter() {\n    const LOGO_URL = (typeof window !== 'undefined' && window.__resources && window.__resources.logoMark) || 'assets/vaelro-logo-mark.png';\n    const shards = this.shards || [];\n    const { assembled, shimmer, settled } = this.state;\n    const box = this.box;\n    const W = (typeof window !== 'undefined' ? window.innerWidth : 1200);\n    const H = (typeof window !== 'undefined' ? window.innerHeight : 800);\n    const size = box ? box.size : 260;\n    const cx = box ? box.cx : W / 2;\n    const cy = box ? box.cy : 250;\n    const logoBg = {\n      backgroundImage: \"url('\" + LOGO_URL + \"')\",\n      backgroundSize: 'contain', backgroundPosition: 'center', backgroundRepeat: 'no-repeat',\n    };\n\n    // ---------- Fixed full-viewport scatter layer (active until settled) ----------\n    const glow = React.createElement('div', { key: 'g', style: {\n      position: 'absolute', inset: '-35%', zIndex: 0, pointerEvents: 'none',\n      background: 'radial-gradient(circle at 50% 48%, rgba(255,122,24,0.45), rgba(255,82,0,0.10) 45%, transparent 70%)',\n      opacity: assembled ? 1 : 0, transition: 'opacity 1.4s ease 0.5s',\n    }});\n    // Radiating burst that fires the instant the fragments lock together.\n    const burst = React.createElement('div', { key: 'burst', style: {\n      position: 'absolute', inset: '-65%', zIndex: 0, pointerEvents: 'none', borderRadius: '50%',\n      background: 'radial-gradient(circle at 50% 50%, rgba(255,150,56,0.6), rgba(255,82,0,0.32) 36%, rgba(255,82,0,0) 66%)',\n      opacity: 0,\n      animation: (shimmer && !settled) ? 'vGlowBurst 1.5s cubic-bezier(0.16,1,0.3,1) forwards' : 'none',\n    }});\n    const pieces = shards.map((s, i) => {\n      const tx = s.sx * W - cx, ty = s.sy * H - cy;\n      return React.createElement('div', { key: i, style: {\n        position: 'absolute', inset: 0, zIndex: 1, ...logoBg,\n        clipPath: s.poly, WebkitClipPath: s.poly,\n        transform: assembled ? 'none' : `translate(${tx}px, ${ty}px) rotate(${s.rot}deg) scale(0.9)`,\n        opacity: box ? 1 : 0,\n        filter: assembled ? 'none' : 'blur(0.3px)',\n        transition: `transform 1.6s cubic-bezier(0.22,1,0.36,1) ${s.delay}ms, filter 0.9s ease ${s.delay}ms, opacity 0.55s ease`,\n        willChange: 'transform',\n      }});\n    });\n    const fixedLayer = React.createElement('div', { key: 'fixed', style: {\n      position: 'fixed', left: cx + 'px', top: cy + 'px', width: size + 'px', height: size + 'px',\n      transform: 'translate(-50%, -50%)', zIndex: 60, pointerEvents: 'none',\n      opacity: settled ? 0 : 1, visibility: settled ? 'hidden' : 'visible',\n      transition: 'opacity 0.5s ease',\n    }}, glow, burst, ...pieces, this.makeStreak('sh', shimmer && !settled));\n\n    // ---------- Static in-flow mark (takes over once settled) ----------\n    const staticInBox = React.createElement('div', { key: 'static', style: {\n      position: 'absolute', inset
